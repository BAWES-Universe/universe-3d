name: Verify standalone game
on:
  push:
    branches-ignore: [release/mvp-open-signup]
  pull_request:
  workflow_call:
    outputs:
      tree:
        description: Git tree verified for the exact triggering SHA
        value: ${{ jobs.verify.outputs.tree }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run verify:container-files
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, authoring, sharedareas, images, imageversions, media, framing, residents, presentation, hud, nearby, terrain, windows, groupplay, arrivals, signup, imagesizing, imageprotocol, placescreation, compactconversations, editorpolish, worldpolish, shellpolish, friendjourney, livefeedback]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.group == 'imageprotocol'
        with:
          ref: bc715ff6ccc0c3d2537e4c003cb4a7bb82745a34
          path: .ci-legacy
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Places recording dependency
        if: matrix.group == 'placescreation'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
      - run: node scripts/test-browser.mjs ${{ matrix.group }}
        env:
          UNIVERSE_LEGACY_SOURCE: ${{ github.workspace }}/.ci-legacy

  dev-image:
    # PR/push verification only: no publishing, environment, deployment token,
    # shared data or live access. Candidate code runs on this disposable runner.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same exact reviewed base as dev-on-dev.yml; equality is regression-tested.
      BASE_IMAGE: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
      SOURCE_SHA: ${{ github.sha }}
      CONTROLLER_SHA: ${{ github.sha }}
      BUILD_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Generate exact public build identity for this CI source
        env:
          SOURCE_DIR: .
          TRUSTED_DIR: .
          SOURCE_OUTPUT: deploy-build.json
        run: node deploy/on-dev/source.mjs prepare
      - name: Build the real on-dev Docker recipe locally on the runner
        id: image
        run: |
          docker build --platform linux/amd64 --file deploy/on-dev/Dockerfile \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" --tag "universe-on-dev-ci:$SOURCE_SHA" .
          id=$(docker image inspect "universe-on-dev-ci:$SOURCE_SHA" --format '{{.Id}}')
          [[ "$id" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image_id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Smoke exact local image without network or persistent data
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: bash deploy/on-dev/container-smoke.sh "$IMAGE_ID"
