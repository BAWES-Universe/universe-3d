name: Verify standalone game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run verify:container-files
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, authoring, sharedareas, images, imageversions, media, framing, residents, presentation, hud, nearby, terrain, windows, groupplay, arrivals, signup, imagesizing, imageprotocol, placescreation, compactconversations, editorpolish, worldpolish, shellpolish, friendjourney]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.group == 'imageprotocol'
        with:
          ref: bc715ff6ccc0c3d2537e4c003cb4a7bb82745a34
          path: .ci-legacy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-browser.mjs ${{ matrix.group }}
        env:
          UNIVERSE_LEGACY_SOURCE: ${{ github.workspace }}/.ci-legacy
